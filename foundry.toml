[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true

# Read access:
#  - test/fixtures: SC-9 HF cross-check vectors (tests)
#  - script/config: per-network risk-params JSON consumed by ConfigureRiskModule (run-all.sh step 13)
#  - deployments:   the run-all.sh deployment summary ConfigureRiskModule reads for the mockTokens map
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "./script/config" },
    { access = "read", path = "./deployments" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Stateful invariant harnesses (test/invariant/* — audit-prep Phase 2.2).
# fail_on_revert = false: handlers intentionally guard against reverting calls
# (e.g. debit beyond balance) and treat the revert as a no-op, so a reverting
# fuzz call should not fail the run — the invariant assertions are the gate.
[invariant]
runs = 256
depth = 32
fail_on_revert = false

[lint]
# Exclude lints for OpenZeppelin upgradeable pattern functions (intentional naming)
# and keccak256 optimization suggestions (performance optimizations, not errors)
exclude_lints = ["mixed-case-function", "asm-keccak256"]
